<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#168BFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#0A1830"/>
    </linearGradient>

    <!-- Metallic Silver Gradient (#C7D0DA primary) -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="65%" stop-color="#C7D0DA"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Cyan / Electric Blue Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Midnight Blue Base Plate -->
  <rect width="400" height="400" rx="36" fill="#071426"/>

  <!-- Ambient Radial Glow -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGlow)"/>

  <!-- Tech Rings -->
  <circle cx="200" cy="200" r="172" fill="#0A1830" stroke="url(#ringGrad)" stroke-width="3"/>
  <circle cx="200" cy="200" r="158" fill="none" stroke="#00E5FF" stroke-width="1.4" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="144" fill="#071426" stroke="#16274D" stroke-width="1.8"/>

  <!-- Orbital tech nodes -->
  <circle cx="200" cy="28" r="4" fill="#00E5FF"/>
  <circle cx="372" cy="200" r="4" fill="#168BFF"/>
  <circle cx="200" cy="372" r="4" fill="#00E5FF"/>
  <circle cx="28" cy="200" r="4" fill="#168BFF"/>

  <!-- Unmistakable, Bold, Smooth Uppercase 'S' -->
  <text x="200" y="278" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="228" 
        font-weight="900" 
        fill="url(#silverGrad)" 
        stroke="#00E5FF" 
        stroke-width="3.5" 
        filter="url(#neonGlow)"
        letter-spacing="-1">S</text>
</svg>